version: '3.8'

services:
  # SQL Server Database
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pubs-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - pubs-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P YourStrong!Passw0rd -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Pubs API Application
  pubs-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pubs-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=pubs;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True;MultipleActiveResultSets=True
      - ASPNETCORE_LOGGING__CONSOLE__DISABLECOLORS=false
    ports:
      - "5159:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - pubs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Blazor WebAssembly Frontend
  pubs-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: pubs-web
    ports:
      - "8081:80"
    depends_on:
      - pubs-api
    networks:
      - pubs-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  sqlserver_data:
    driver: local
    name: pubs_sqlserver_data

networks:
  pubs-network:
    driver: bridge
    name: pubs_network
